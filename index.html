<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For You ♡</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    font-family: Arial, sans-serif;
    overflow: hidden;
    background: linear-gradient(135deg, #fff0f7, #edf9ff);
}


/* ==================================================
   OPENING SCREEN
================================================== */

#opening {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(244, 171, 201, .35),
            transparent 35%
        ),
        radial-gradient(
            circle at 80% 80%,
            rgba(169, 217, 239, .4),
            transparent 35%
        ),
        #fff8fc;

    z-index: 1000;

    transition:
        opacity .8s ease,
        visibility .8s ease;
}

#opening.closed {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}


/* ==================================================
   OPENING CONTENT
================================================== */

.opening-content {
    text-align: center;
    width: 100%;
}

.small-text {
    margin-bottom: 35px;

    font-size: 10px;
    letter-spacing: 4px;

    color: #9b929c;
}


/* ==================================================
   GIFT BUTTON
================================================== */

#giftButton {
    position: relative;

    width: 230px;
    height: 230px;

    border: none;
    outline: none;

    background: transparent;

    cursor: pointer;

    display: block;

    margin: 0 auto;

    padding: 0;

    -webkit-tap-highlight-color: transparent;

    touch-action: manipulation;

    z-index: 2000;
}


/* ==================================================
   GIFT
================================================== */

.gift {
    position: absolute;

    width: 190px;
    height: 170px;

    left: 20px;
    top: 30px;

    animation: floating 2s ease-in-out infinite;

    transition: transform .2s ease;
}

#giftButton:active .gift {
    transform: scale(.94);
}


/* ==================================================
   BOX BODY
================================================== */

.box {
    position: absolute;

    width: 150px;
    height: 100px;

    left: 20px;
    bottom: 0;

    background: #f2a7c7;

    border-radius: 8px;

    box-shadow:
        0 20px 40px rgba(210, 120, 165, .25);
}


/* vertical ribbon */

.box::before {
    content: "";

    position: absolute;

    width: 25px;
    height: 100%;

    left: 50%;
    top: 0;

    transform: translateX(-50%);

    background: #dff5ff;
}


/* ==================================================
   LID
================================================== */

.lid {
    position: absolute;

    width: 170px;
    height: 38px;

    left: 10px;
    top: 38px;

    background: #f6b4d0;

    border-radius: 8px;

    z-index: 5;

    transition:
        transform 1s
        cubic-bezier(.68,-.55,.27,1.55);
}


/* lid ribbon */

.lid::before {
    content: "";

    position: absolute;

    width: 25px;
    height: 100%;

    left: 50%;
    top: 0;

    transform: translateX(-50%);

    background: #dff5ff;
}


/* ==================================================
   BOW
================================================== */

.bow {
    position: absolute;

    width: 80px;
    height: 50px;

    left: 55px;
    top: 10px;

    z-index: 10;

    transition:
        transform 1s
        cubic-bezier(.68,-.55,.27,1.55);
}

.bow::before,
.bow::after {
    content: "";

    position: absolute;

    width: 34px;
    height: 25px;

    border: 8px solid #dff5ff;

    border-radius: 50%;
}

.bow::before {
    left: 0;
    transform: rotate(25deg);
}

.bow::after {
    right: 0;
    transform: rotate(-25deg);
}


/* ==================================================
   OPEN GIFT ANIMATION
================================================== */

#giftButton.open .lid {
    transform:
        translateY(-100px)
        rotate(-12deg);
}

#giftButton.open .bow {
    transform:
        translateY(-100px)
        rotate(-12deg);
}

#giftButton.open .gift {
    animation: none;
}


/* ==================================================
   TEXT
================================================== */

.hint {
    margin-top: 35px;

    font-size: 10px;
    letter-spacing: 3px;

    color: #958d97;

    animation: pulse 1.8s infinite;
}


/* ==================================================
   MAIN WEBSITE
================================================== */

#website {
    width: 100%;
    height: 100vh;

    display: none;

    overflow-y: auto;

    background:
        linear-gradient(
            135deg,
            #fff8fc,
            #f3fbff
        );
}

#website.show {
    display: block;
}


/* ==================================================
   PAGES
================================================== */

.page {
    min-height: 100vh;

    padding: 60px 25px;

    display: none;

    justify-content: center;
    align-items: center;

    text-align: center;
}

.page.active {
    display: flex;
}

.container {
    width: 100%;
    max-width: 850px;
    margin: auto;
}


/* ==================================================
   TYPOGRAPHY
================================================== */

.eyebrow {
    font-size: 10px;
    letter-spacing: 4px;

    color: #aaa1ab;

    margin-bottom: 25px;
}

h1,
h2 {
    font-family: Georgia, serif;

    font-weight: normal;

    color: #554e58;
}

.main-title {
    font-size: clamp(55px, 10vw, 100px);

    line-height: .9;
}

.main-title span,
h2 span {
    color: #d97fa7;
    font-style: italic;
}

.description {
    max-width: 550px;

    margin: 30px auto;

    color: #88808b;

    font-size: 13px;

    line-height: 2;
}


/* ==================================================
   BUTTON
================================================== */

.next {
    border: none;

    padding: 15px 30px;

    border-radius: 50px;

    background:
        linear-gradient(
            135deg,
            #efa5c5,
            #a7d9ef
        );

    color: white;

    cursor: pointer;

    font-size: 11px;

    letter-spacing: 1px;

    box-shadow:
        0 15px 30px
        rgba(190, 130, 165, .2);

    transition: .3s;
}

.next:hover {
    transform: translateY(-3px);
}


/* ==================================================
   COUNTER
================================================== */

.counter {
    display: flex;

    justify-content: center;

    gap: 12px;

    margin: 40px auto;
}

.counter-item {
    width: 130px;

    padding: 25px 10px;

    background: white;

    border-radius: 20px;

    box-shadow:
        0 15px 40px
        rgba(80, 70, 90, .08);
}

.number {
    font-family: Georgia, serif;

    font-size: 38px;

    color: #d97fa7;
}

.label {
    margin-top: 5px;

    font-size: 8px;

    letter-spacing: 2px;

    color: #aaa1ab;
}


/* ==================================================
   MEMORIES
================================================== */

.memory {
    max-width: 600px;

    margin: 40px auto;

    background: white;

    padding: 12px;

    border-radius: 25px;

    box-shadow:
        0 20px 60px
        rgba(80, 70, 90, .1);
}

.memory img {
    display: block;

    width: 100%;
    height: 350px;

    object-fit: cover;

    border-radius: 17px;
}

.memory h3 {
    font-family: Georgia, serif;

    margin-top: 18px;

    font-size: 25px;

    color: #554e58;
}

.memory p {
    margin: 8px 0 15px;

    font-size: 11px;

    color: #99919b;
}


/* ==================================================
   QUIZ
================================================== */

.quiz {
    max-width: 600px;

    margin: 35px auto;

    padding: 35px;

    background: white;

    border-radius: 25px;

    box-shadow:
        0 20px 60px
        rgba(80, 70, 90, .1);
}

.question {
    font-family: Georgia, serif;

    font-size: 28px;

    margin-bottom: 25px;
}

.answer {
    display: block;

    width: 100%;

    padding: 14px;

    margin: 10px 0;

    background: white;

    border: 1px solid #eadfe6;

    border-radius: 15px;

    cursor: pointer;

    color: #6e6770;
}

.answer:hover {
    border-color: #efa8c6;
}

   FLOWERS
================================================== */
